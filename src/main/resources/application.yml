spring:
  application:
    name: simple-queue-service
  
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 500ms              # 5000ms에서 500ms로 감소 (10x 빠름)
    connect-timeout: 1000ms     # 3000ms에서 1000ms로 감소 (3x 빠름)
    lettuce:
      pool:
        max-active: 100  # 50에서 100으로 증가 (2x) - 고성능 전용
        max-idle: 30     # 20에서 30으로 증가 (1.5x)
        min-idle: 15     # 5에서 15로 증가 (3x) - 연결 준비
        max-wait: 100ms  # 2000ms에서 100ms로 감소 (20x 빠름)
        time-between-eviction-runs: 10000ms  # 30s에서 10s로 감소
      shutdown-timeout: 50ms     # 100ms에서 50ms로 감소
      cluster:
        refresh:
          adaptive: true
          period: 15000ms        # 30s에서 15s로 감소
      # 고성능 전용 설정
      read-timeout: 300ms        # 3000ms에서 300ms로 감소 (10x)
      write-timeout: 300ms       # 3000ms에서 300ms로 감소 (10x)
      # TCP 연결 최적화
      tcp-nodelay: true          # Nagle 알고리즘 비활성화
      tcp-keepalive: true        # TCP Keep-Alive 활성화
  
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: NON_NULL

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

app:
  queue:
    default-visibility-timeout: 30
    max-message-size: 262144  # 256KB
    max-messages-per-batch: 10
    scheduler-interval: 30000  # 30초
    default-message-retention-period: 1209600  # 14일
    max-receive-count: 3
    # 성능 최적화 설정
    enable-compression: true
    compression-threshold: 1024  # 1KB 이상 메시지 압축
    partition-count: 4
    enable-partitioning: true
  
  # 스토리지 계층화 설정
  storage:
    hot:
      ttl-hours: 1
      max-memory-usage-percent: 80
    warm:
      # RocksDB 설정
      rocksdb:
        path: ${WARM_STORAGE_PATH:./data/warm}
        max-open-files: 1000
        write-buffer-size: 67108864  # 64MB
        max-write-buffer-number: 3
        level0-file-num-compaction-trigger: 4
        target-file-size-base: 67108864  # 64MB
        max-bytes-for-level-base: 268435456  # 256MB
      ttl-days: 1
      max-disk-usage-gb: 100
    cold:
      base-path: ${COLD_STORAGE_PATH:./data/cold}
      compression-enabled: true
      encryption-enabled: false
      max-file-size-mb: 100
    tiering:
      enabled: true
      check-interval-seconds: 300  # 5분
      batch-size: 1000
      hot-to-warm-age-seconds: 3600    # 1시간
      warm-to-cold-age-seconds: 86400  # 24시간
      # FIFO 큐 전용 설정
      fifo:
        hot-max-count: 100          # Hot Storage 최대 메시지 개수
        warm-max-count: 1000        # Warm Storage 최대 메시지 개수
        hot-time-threshold-hours: 1  # Hot → Warm 이관 시간 임계값
        warm-time-threshold-hours: 24 # Warm → Cold 이관 시간 임계값
        enable-hot-warm-swap: true   # Hot-Warm 스왑 활성화
  
  # Redis 성능 최적화 설정 (대형 개선)
  redis:
    performance:
      io-thread-pool-size: 16     # 4에서 16으로 증가 (4x)
      computation-thread-pool-size: 8  # CPU 코어 수 매칭
      command-timeout-ms: 500     # 5000에서 500으로 감소 (10x 빠름)
      enable-pipelining: true
      pipeline-buffer-size: 5000  # 1000에서 5000으로 증가 (5x)
      max-pool-size: 50          # 20에서 50으로 증가 (2.5x)
      min-idle-size: 10          # 5에서 10으로 증가 (2x)

logging:
  level:
    com.example.sqs: DEBUG
    org.springframework.data.redis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
