spring:
  application:
    name: simple-queue-service
  
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 8
        min-idle: 2
        max-wait: 1000ms
      shutdown-timeout: 100ms
  
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: NON_NULL

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

app:
  queue:
    default-visibility-timeout: 30
    max-message-size: 262144  # 256KB
    max-messages-per-batch: 10
    scheduler-interval: 30000  # 30초
    default-message-retention-period: 1209600  # 14일
    max-receive-count: 3
    # 성능 최적화 설정
    enable-compression: true
    compression-threshold: 1024  # 1KB 이상 메시지 압축
    partition-count: 4
    enable-partitioning: true
  
  # 스토리지 계층화 설정
  storage:
    hot:
      ttl-hours: 1
      max-memory-usage-percent: 80
    warm:
      ttl-days: 1
      max-disk-usage-gb: 100
    cold:
      base-path: ${COLD_STORAGE_PATH:/tmp/sqs-cold-storage}
      compression-enabled: true
      encryption-enabled: false
      max-file-size-mb: 100
    tiering:
      enabled: true
      check-interval-seconds: 300  # 5분
      batch-size: 1000
      hot-to-warm-age-seconds: 3600    # 1시간
      warm-to-cold-age-seconds: 86400  # 24시간
  
  # Redis 성능 최적화 설정
  redis:
    performance:
      io-thread-pool-size: 4
      computation-thread-pool-size: 4
      command-timeout-ms: 5000
      enable-pipelining: true
      pipeline-buffer-size: 1000
      max-pool-size: 20
      min-idle-size: 5

logging:
  level:
    com.example.sqs: DEBUG
    org.springframework.data.redis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
